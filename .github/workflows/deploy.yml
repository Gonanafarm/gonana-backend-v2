name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16.14.0

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to DigitalOcean
        run: |
          ssh user@your-droplet-ip 'cd /path/to/your/app && git pull'
          ssh user@your-droplet-ip 'cd /path/to/your/app && npm install --production'
          ssh user@your-droplet-ip 'cd /path/to/your/app && pm2 restart your-app-name'
